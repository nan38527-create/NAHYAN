<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Stay - Grand Hotel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <a href="index.html"><h2>Grand Hotel</h2></a>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="hamburger">☰</div>
        </nav>
    </header>

    <section class="booking-section">
        <h2>Book Your Stay</h2>
        <form id="bookingForm">
            <div class="step" data-step="1">
                <label for="roomType">Select Room:</label>
                <select id="roomType" name="roomType" required>
                    <option value="">Choose a room</option>
                    <option value="Standard Room">Standard Room - AED 150/night</option>
                    <option value="Deluxe Room">Deluxe Room - AED 250/night</option>
                    <option value="Suite">Suite - AED 400/night</option>
                    <option value="Family Room">Family Room - AED 300/night</option>
                </select>
            </div>

            <div class="step" data-step="2" style="display: none;">
                <fieldset>
                    <legend>Select Amenities (multiple):</legend>
                    <label><input type="checkbox" name="amenities" value="Free Wi-Fi"> Free Wi-Fi - AED 20/night</label>
                    <label><input type="checkbox" name="amenities" value="Swimming Pool"> Swimming Pool - AED 50/night</label>
                    <label><input type="checkbox" name="amenities" value="Buffet"> Buffet - AED 100/night</label>
                    <label><input type="checkbox" name="amenities" value="Gym"> Gym - AED 30/night</label>
                    <label><input type="checkbox" name="amenities" value="Spa"> Spa - AED 150/night</label>
                </fieldset>
            </div>

            <div class="step" data-step="3" style="display: none;">
                <div id="totalPrice">Total Price: AED 0/night</div>

                <label for="checkIn">Check-in Date:</label>
                <input type="date" id="checkIn" name="checkIn" required>

                <label for="checkOut">Check-out Date:</label>
                <input type="date" id="checkOut" name="checkOut" required>
            </div>

            <div class="step" data-step="4" style="display: none;">
                <div id="guestNamesContainer">
                    <div class="guest-label-row">
                        <label for="guestName1">Guest Name:</label>
                        <button type="button" id="addGuestBtn" class="add-btn">+</button>
                    </div>
                    <input type="text" id="guestName1" name="guestName[]" required>
                </div>
            </div>

            <div class="step" data-step="5" style="display: none;">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone" required>
            </div>

            <div class="step" data-step="6" style="display: none;">
                <label for="specialRequests">Medical Issues:</label>
                <textarea id="specialRequests" name="specialRequests" rows="4" placeholder="Any medical issues or requirements..."></textarea>
                <a href="sickness.html" class="cta-button" style="display: inline-block; margin-top: 10px;">Report Sickness</a>

                <fieldset>
                    <legend>Payment Method:</legend>
                    <label><input type="radio" name="payment" value="Credit Card" required> Credit Card</label>
                    <label><input type="radio" name="payment" value="PayPal"> PayPal</label>
                    <label><input type="radio" name="payment" value="Cash on Arrival"> Cash on Arrival</label>
                </fieldset>

                <button type="submit" class="cta-button">Confirm Booking</button>
            </div>
        </form>
    </section>

    <footer>
        <p>&copy; 2025 Abdulla Bin Nasser School. All rights reserved.</p>
        <ul class="footer-links">
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="#">Privacy Policy</a></li>
        </ul>
    </footer>

    <script src="script.js"></script>
</body>
</html>
